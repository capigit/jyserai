<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>J'y Serai - HIRDE Kankalabé 2026</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/posters/Logo.png" />
  <link rel="apple-touch-icon" href="assets/images/posters/Logo.png" />

  <!-- Open Graph / partage WhatsApp & réseaux sociaux -->
  <!-- TODO déploiement : remplacer SITE_URL par l'URL GitHub Pages finale -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="SITE_URL" />
  <meta property="og:title"       content="J'y Serai - HIRDE Kankalabé 2026" />
  <meta property="og:description" content="Mettez votre photo sur l'affiche du HIRDE Kankalabé !" />
  <meta property="og:image"       content="SITE_URLassets/images/posters/hirde.png" />
  <meta name="twitter:card"       content="summary_large_image" />
  <meta name="twitter:title"      content="J'y Serai - HIRDE Kankalabé 2026" />
  <meta name="twitter:description" content="Mettez votre photo sur l'affiche du HIRDE Kankalabé !" />
  <meta name="twitter:image"      content="SITE_URLassets/images/posters/hirde.png" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#073226" />
  <meta name="description" content="Mettez votre photo sur l'affiche du HIRDE Kankalabé 2026 et partagez-la !" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="page">

    <header>
      <div class="header-inner">
        <img src="assets/images/posters/Logo.png" alt="Logo AJDK" class="header-logo" />
        <div class="header-text">
          <h1>J'y Serai !</h1>
          <p>HIRDE Kankalabé · 28 novembre 2026</p>
        </div>
      </div>
    </header>

    <main>

      <!-- Section upload -->
      <section class="upload-section" id="uploadSection" hidden>
        <div class="processing-overlay hidden" id="processingOverlay" role="status" aria-live="polite">
          <div class="spinner"></div>
          <span>Préparation de la photo…</span>
        </div>

        <div class="tagline">
          <h2 id="taglineTitle">Prenez votre place !</h2>
          <p id="taglineDesc"><strong class="artist">HIRDE KANKALABÉ</strong></p>
        </div>

        <div class="poster-teaser" id="uploadZone">
          <div class="poster-loader" id="posterLoader">
            <div class="spinner"></div>
            <span>Chargement de l'affiche…</span>
          </div>
          <img src="assets/images/posters/hirde.png" alt="Affiche HIRDE Kankalabé" draggable="false" id="posterImgEl" />
          <div class="frame-hot" id="frameHot">
            <div class="frame-inner">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              <span>Votre photo<br>ici</span>
            </div>
          </div>
        </div>

        <!-- Inputs fichier -->
        <input type="file" id="fileInput"   accept="image/*"            hidden />
        <input type="file" id="cameraInput" accept="image/*" capture="user" hidden />

        <!-- Bouton principal galerie -->
        <button class="btn-cta" id="selectBtn" aria-label="Choisir une photo depuis la galerie">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Choisir une photo
        </button>

        <!-- Bouton selfie (caméra directe) -->
        <button class="btn-camera" id="cameraBtn" aria-label="Prendre une selfie avec la caméra">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
          Prendre une selfie
        </button>

      </section>

      <!-- Section recadrage -->
      <section class="crop-section" id="cropSection" hidden>
        <p class="crop-title">Recadrez votre photo</p>
        <div class="crop-wrapper" id="cropWrapper">
          <img id="cropImg" draggable="false" />
          <div class="crop-gesture-hint" id="cropGestureHint">
            <span id="cropGestureText">Glisse · Pince pour zoomer</span>
          </div>
        </div>
        <div class="crop-actions">
          <button class="btn btn-icon" id="rotateCCW" title="Tourner à gauche" aria-label="Tourner à gauche">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
            </svg>
          </button>
          <button class="btn btn-icon" id="rotateCW" title="Tourner à droite" aria-label="Tourner à droite">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-.49-3.51"/>
            </svg>
          </button>
          <button class="btn btn-secondary" id="cropCancel">Annuler</button>
          <button class="btn btn-primary" id="cropConfirm">✓ Confirmer</button>
        </div>
      </section>

      <!-- Section résultat -->
      <section class="result-section" id="resultSection" hidden>
        <div class="canvas-wrapper">
          <canvas id="canvas"></canvas>
          <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
            <div class="spinner"></div>
            <span id="loadingText">En attente d'une image…</span>
          </div>
        </div>

        <div class="actions" id="resultActions" hidden>

          <!-- Partage social — WhatsApp + Facebook -->
          <div class="actions-row">
            <button class="btn btn-whatsapp" id="whatsappBtn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="19" height="19">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
              </svg>
              WhatsApp
            </button>
            <button class="btn btn-facebook" id="facebookBtn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="19" height="19">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              Facebook
            </button>
          </div>

          <!-- Ligne secondaire -->
          <div class="actions-row">
            <button class="btn btn-secondary" id="changeBtn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              Changer photo
            </button>
            <button class="btn btn-outline" id="downloadBtn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Télécharger
            </button>
          </div>

        </div>
      </section>

    </main>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer>
      <img src="assets/images/posters/Logo.png" alt="AJDK" class="footer-logo" />
      <p>AJDK · HIRDE Kankalabé 2026</p>
    </footer>

  </div>

  <script src="assets/js/app.js"></script>
  <noscript>
    <div style="text-align:center;padding:48px 24px;font-family:sans-serif;color:#073226;">
      <p style="font-size:18px;font-weight:700;margin-bottom:8px;">JavaScript est requis</p>
      <p style="font-size:14px;opacity:0.75;">Activez JavaScript dans votre navigateur pour utiliser cette application.</p>
    </div>
  </noscript>
</body>
</html>
